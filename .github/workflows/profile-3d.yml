name: Generate 3D contributions

on:
  # every day at 00:30 UTC (07:30 in Vietnam), after the snake
  schedule:
    - cron: "30 0 * * *"
  # the "Run workflow" button in the Actions tab
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Draw the 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Halloween colours, matching the snake; one file for light mode and one for dark mode
          SETTING_JSON: .github/profile-3d.json

      # A branch of its own: the snake's publish step replaces everything on `output`
      - name: Publish the images to the output-3d branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output-3d
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
