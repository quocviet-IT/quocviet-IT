name: Generate 3D contributions

on:
  # every day at 00:30 UTC (07:30 in Vietnam), after the snake
  schedule:
    - cron: "30 0 * * *"
  # the "Run workflow" button in the Actions tab
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draw the isometric calendar with the Contributions and Streaks panels
        run: node scripts/contrib-card.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUT_DIR: dist-3d

      # A branch of its own: the snake's publish step replaces everything on `output`
      - name: Publish the images to the output-3d branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output-3d
          build_dir: dist-3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
