name: Generate snake

on:
  # every day at 00:00 UTC (07:00 in Vietnam)
  schedule:
    - cron: "0 0 * * *"
  # the "Run workflow" button in the Actions tab
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Draw the snake from the contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # "Ocean": orange snake on a blue grid. color_dots = empty cell, then lowest to highest.
          outputs: |
            dist/github-snake.svg?color_snake=#ff8c00&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff9f1c&color_dots=#161b22,#0c2d6b,#1158c7,#388bfd,#79c0ff

      - name: Publish the images to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
